{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  {% for runner in sync_runners %}
  <li>
    <form method="post" action="{% url 'admin:sync_run' runner.kind %}" style="display:inline">{% csrf_token %}
      <button type="submit" class="button" style="border-radius:999px">Lancer : {{ runner.label }}</button>
    </form>
  </li>
  {% endfor %}
{% endblock %}
