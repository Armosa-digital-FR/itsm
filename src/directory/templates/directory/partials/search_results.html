{% if query|length < 2 %}
{% elif people %}
<ul class="picker-results">
  {% for person in people %}
  <li><button type="button" data-pick-person="{{ person.pk }}" data-target="{{ target }}"
      data-name="{{ person }}" data-email="{{ person.email }}" data-entite="{{ person.subsidiary|default:'Entité non renseignée' }}" data-site="{{ person.site|default:'site non renseigné' }}">
    <strong>{{ person }}</strong>
    <span class="muted">{{ person.email|default:"sans e-mail" }} · {{ person.subsidiary|default:"entité ?" }} · {{ person.site|default:"site ?" }}</span>
  </button></li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">Aucun utilisateur actif ne correspond à « {{ query }} ».</p>
{% endif %}
