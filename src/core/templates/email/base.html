<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Support informatique{% endblock %}</title></head>
<body style="margin:0;padding:0;background:#e6e6e6;color:#05232f;font-family:Roboto,Arial,sans-serif;font-weight:300;font-size:16px;line-height:1.5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e6e6e6;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
        <tr><td style="padding:0 0 24px 0;">
          <img src="cid:logo" width="200" alt="Armosa Digital" style="display:block;width:200px;height:auto;border:0;">
        </td></tr>
        <tr><td style="background:#ffffff;padding:32px;">
          <p style="margin:0 0 8px 0;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#1f454d;">{% block eyebrow %}Support informatique{% endblock %}</p>
          <h1 style="margin:0 0 24px 0;padding-bottom:12px;border-bottom:1px solid #05232f;font-weight:400;font-size:28px;line-height:1.25;color:#05232f;">{% block heading %}{% endblock %}</h1>
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:24px 8px 0 8px;font-size:13px;color:#1f454d;">
          {% block footer %}Répondez directement à cet e-mail pour compléter votre demande. Merci de conserver la référence entre crochets dans l'objet.{% endblock %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
