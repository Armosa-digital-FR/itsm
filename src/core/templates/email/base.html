<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Support informatique{% endblock %}</title></head>
<body style="margin:0;padding:0;background:#f6f5f0;color:#25302b;font-family:'IBM Plex Sans',Arial,sans-serif;font-size:15px;line-height:1.55;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f5f0;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
        <tr><td style="padding:0 0 24px 0;">
          <img src="cid:logo" width="200" alt="Armosa Digital" style="display:block;width:200px;height:auto;border:0;">
        </td></tr>
        <tr><td style="background:#fbfaf6;border:1px solid #d9e0da;border-radius:16px;padding:32px;">
          <p style="margin:0 0 8px 0;font-family:'IBM Plex Mono',Menlo,monospace;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#4a6355;">{% block eyebrow %}Support informatique{% endblock %}</p>
          <h1 style="margin:0 0 16px 0;font-family:'EB Garamond',Georgia,serif;font-weight:500;font-size:28px;line-height:1.25;color:#25302b;">{% block heading %}{% endblock %}</h1>
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:24px 8px 0 8px;font-size:13px;color:#656f6a;">
          {% block footer %}Répondez directement à cet e-mail pour compléter votre demande. Merci de conserver la référence entre crochets dans l'objet.{% endblock %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
