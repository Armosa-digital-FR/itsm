{# Chronomètre en cours dans l'en-tête ; renvoyé « hors bande » après une action HTMX. #}
<div id="timer-slot"{% if oob %} hx-swap-oob="true"{% endif %}>
{% if running_timer %}
    <form class="timer-chip" method="post" action="{% url 'helpdesk:timer_stop' running_timer.ticket.number %}" aria-label="Chronomètre en cours">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <span class="label">Chronomètre</span>
      <a href="{% url 'helpdesk:ticket_detail' running_timer.ticket.number %}">{{ running_timer.ticket.reference }}</a>
      <span class="mono" data-timer-start="{{ running_timer.started_at|date:'c' }}">—</span>
      <button class="btn btn-small" type="submit">Arrêter</button>
    </form>
{% endif %}
</div>
